<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1f;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;padding:20px}.card{background:#0e0e14;border:1px solid #1e1e2a;border-radius:8px;padding:12px 16px;width:360px}.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.label{font-size:10px;font-weight:600;letter-spacing:.08em;color:#4b5563;text-transform:uppercase}.qty{font-size:10px;color:#4b5563}.divider{border-top:1px solid #1e1e2a;margin-bottom:10px}.price{font-size:34px;font-weight:900;color:#D4FF1F;line-height:1;margin-bottom:5px}.subline{font-size:11px;color:#4b5563;font-weight:400;letter-spacing:.01em}</style>
</head><body>
<div class="card">
  <div class="top-row">
    <span class="label">TOTAL</span>
    <span class="qty">8 × BPC-157 5mg</span>
  </div>
  <div class="divider"></div>
  <div class="price">$540</div>
  <div class="subline">$67.50 / vial &nbsp;·&nbsp; $85 single-pack</div>
</div>
</body></html>
