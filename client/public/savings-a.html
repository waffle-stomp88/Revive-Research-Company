<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1f;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;padding:20px}.card{background:#22222a;border:1px solid #2a2a35;border-radius:12px;padding:20px 24px;width:380px}.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.label{font-size:11px;font-weight:600;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.sub{font-size:11px;color:#6b7280}.divider{border-top:1px solid #2a2a35;margin-bottom:12px}.total-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.price{font-size:34px;font-weight:900;color:#D4FF1F;line-height:1}.badge{font-size:13px;font-weight:600;color:#21d8ff;background:rgba(33,216,255,.1);border-radius:6px;padding:2px 7px;line-height:1.4}.comparison{font-size:11px;color:#6b7280;font-weight:400}.variant-label{margin-top:8px;font-size:10px;color:#374151;font-style:italic}</style>
</head><body>
<div class="card">
  <div class="label-row">
    <span class="label">TOTAL</span>
    <span class="sub">8 vials · $67.50/vial</span>
  </div>
  <div class="divider"></div>
  <div class="total-row">
    <span class="price">$540</span>
    <span class="badge">↓20.6%</span>
    <span class="comparison">vs $680 at single-vial pricing</span>
  </div>
  <div class="variant-label">A — "vs" factual reference (current)</div>
</div>
</body></html>
