<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 920" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="200" y1="0" x2="200" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#0099CC" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#005588" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <g fill="url(#bodyGrad)" stroke="#00D4FF" stroke-width="1.8" stroke-linejoin="round">
    <!-- Head — slightly rounder -->
    <ellipse cx="200" cy="66" rx="52" ry="60"/>
    <!-- Neck — slimmer -->
    <polygon points="184,124 216,124 212,170 188,170"/>
    <!-- Torso — narrower shoulders, defined hourglass waist -->
