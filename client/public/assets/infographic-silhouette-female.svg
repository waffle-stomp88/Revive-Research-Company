    <!-- Hips — wider than shoulders for hourglass -->
    <polygon points="124,440 276,440 314,510 86,510"/>
    <!-- Left arm — slimmer -->
    <polygon points="80,174 94,174 90,298 58,400 28,388 46,182"/>
    <!-- Left hand -->
    <ellipse cx="43" cy="415" rx="18" ry="14"/>
    <!-- Right arm -->
    <polygon points="306,174 320,174 354,182 372,388 342,400 310,298"/>
    <!-- Right hand -->
    <ellipse cx="357" cy="415" rx="18" ry="14"/>
    <!-- Left leg — slimmer, slight curve -->
    <polygon points="86,510 190,510 174,726 162,920 68,920 82,726"/>
    <!-- Right leg -->
    <polygon points="210,510 314,510 318,726 332,920 226,920 226,726"/>
  </g>
</svg>
